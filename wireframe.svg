<text x="870" y="613" font-size="14" text-anchor="start" dominant-baseline="central" font-weight="400" fill="#1F2937" xml:space="preserve">    to cycle the panel gradient.</text>
<text x="870" y="639" font-size="14" text-anchor="start" dominant-baseline="central" font-weight="400" fill="#1F2937" xml:space="preserve">3. Close button exits the app.</text>
